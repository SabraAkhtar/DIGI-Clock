<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 25%, #0d1128 50%, #1e2442 75%, #0a0e27 100%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated grid background for dashboard feel */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        /* Glowing orb effect */
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(59, 130, 246, 0.08) 30%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        #clock {
            /* Typography - Bold digital style */
            font-family: 'Orbitron', 'Courier New', monospace;
            font-size: clamp(3.5rem, 14vw, 8rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            color: #38bdf8;
            
            /* Neon glow effect */
            text-shadow:
                0 0 10px rgba(56, 189, 248, 0.8),
                0 0 20px rgba(56, 189, 248, 0.6),
                0 0 40px rgba(56, 189, 248, 0.4),
                0 0 80px rgba(59, 130, 246, 0.3),
                0 0 120px rgba(59, 130, 246, 0.2);

            /* Dashboard panel styling */
            background: linear-gradient(
                145deg,
                rgba(15, 23, 42, 0.9) 0%,
                rgba(30, 41, 59, 0.8) 100%
            );
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: clamp(30px, 6vw, 60px) clamp(40px, 10vw, 100px);
            
            /* Glass morphism effect */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            /* Layered shadows for depth */
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.2),
                0 8px 32px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
            
            /* Smooth entrance animation */
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            
            /* Relative positioning for z-index */
            position: relative;
            z-index: 10;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #clock {
                font-size: clamp(2.5rem, 12vw, 5rem);
                letter-spacing: 0.08em;
                border-radius: 16px;
                padding: clamp(20px, 5vw, 40px) clamp(30px, 8vw, 60px);
            }
        }

        @media (max-width: 480px) {
            #clock {
                border-width: 1.5px;
                letter-spacing: 0.06em;
            }
            
            body::after {
                width: 400px;
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <h1 id="clock"></h1>
</body>
<script>
    function showTime(){
        let date = new Date();
        let hours= date.getHours();
        let min= date.getMinutes();
        let sec=date.getSeconds();
        
     if(hours>=12)
     {
      hours=hours-12;
     }
      hours= hours < 10 ? "0" + hours : hours;

      if (min < 10) {
                min = "0" + min;
            }

            if (sec < 10) {
                sec = "0" + sec;
            }

    
        let time= hours  + ":" + min  + ":"+ sec;
    document.getElementById("clock").innerHTML=time;

     
    
    }
    showTime();
  setInterval(showTime, 1000);


</script>
</html>
